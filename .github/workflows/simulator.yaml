name: simulator

on:
  push:
    branches: [main]
    tags: ["simulator-v*"]
    paths: ["simulations/nvidia-sim/**", ".github/workflows/simulator.yaml"]
  pull_request:
    paths: ["simulations/nvidia-sim/**", ".github/workflows/simulator.yaml"]

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: simulations/nvidia-sim

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: simulations/nvidia-sim/go.mod
          cache-dependency-path: simulations/nvidia-sim/go.sum
      - run: make verify    # regenerates code, CRDs, RBAC, CATALOG.md; fails if stale; runs tests

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/simulator
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=simulator-v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: simulations/nvidia-sim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ github.ref_name }}
