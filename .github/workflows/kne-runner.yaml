name: kne-runner

on:
  push:
    branches: [main]
    paths: ["environments/network-kne/runner/**", ".github/workflows/kne-runner.yaml"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: environments/network-kne/runner
          platforms: linux/amd64
          push: true
          # Tag = KNE version (see the Dockerfile's KNE_VERSION)
          tags: ghcr.io/${{ github.repository }}/kne-runner:v0.3.4
