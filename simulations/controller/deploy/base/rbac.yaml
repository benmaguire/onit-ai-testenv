apiVersion: v1
kind: ServiceAccount
metadata:
  name: testenv-simulator
---
# Cluster-wide permissions are generated from kubebuilder markers into
# rbac/role.yaml (make manifests). Bound here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: testenv-simulator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: testenv-simulator
subjects:
  - kind: ServiceAccount
    name: testenv-simulator
    namespace: sim-system
---
# Namespaced: leader election, and (hub) agent token Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: testenv-simulator
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: testenv-simulator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: testenv-simulator
subjects:
  - kind: ServiceAccount
    name: testenv-simulator
    namespace: sim-system
