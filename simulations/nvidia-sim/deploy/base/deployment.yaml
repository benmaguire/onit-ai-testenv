apiVersion: apps/v1
kind: Deployment
metadata:
  name: testenv-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: testenv-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: testenv-simulator
    spec:
      serviceAccountName: testenv-simulator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simulator
          image: simulator
          args:
            - --mode=agent
            - --leader-elect
            - --api-addr=:8443
            - --api-token-file=/etc/simulator/token/token
            - --mokka-namespace=nvidia-sim-mokka
            - --default-graph=mocker-agg
            - --default-graph-namespace=nvidia-sim
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SIM_CLUSTER_NAME
              value: local
            - name: SIM_ENVIRONMENT
              value: nvidia-sim
          ports:
            - name: api
              containerPort: 8443
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: api-token
              mountPath: /etc/simulator/token
              readOnly: true
      volumes:
        - name: api-token
          secret:
            secretName: simulator-api-token
