---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: simulations.sim.testenv.onit.ai
spec:
  group: sim.testenv.onit.ai
  names:
    categories:
    - testenv
    kind: Simulation
    listKind: SimulationList
    plural: simulations
    shortNames:
    - sim
    - sims
    singular: simulation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.injectedAt
      name: Injected
      type: date
    - jsonPath: .status.recoverAt
      name: Recover-At
      priority: 1
      type: date
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Simulation injects one failure into the environment and recovers
          from it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SimulationSpec describes a fault to inject and how it recovers.
            properties:
              delay:
                description: Delay before injecting.
                type: string
              duration:
                description: |-
                  Duration the fault stays injected before automatic recovery. Empty means
                  it stays until spec.recover is set to true or the Simulation is deleted.
                type: string
              params:
                additionalProperties:
                  type: string
                description: 'Params are type-specific parameters (all strings), e.g.
                  {"xid": "79"}.'
                type: object
              recover:
                description: Recover requests recovery now. Set by `simctl recover`
                  / the API.
                type: boolean
              recoveryTimeout:
                description: |-
                  RecoveryTimeout bounds how long recovery verification may take
                  (e.g. waiting for killed pods to be Ready again). Default 5m.
                type: string
              target:
                description: Target of the simulation.
                properties:
                  component:
                    description: 'Component is a Dynamo component type: frontend,
                      decode, prefill, worker.'
                    type: string
                  count:
                    description: Count limits how many matched pods/nodes are affected.
                      0 means all.
                    format: int32
                    minimum: 0
                    type: integer
                  gpu:
                    description: 'GPU on the node: an index, "all", or a UUID. Default
                      "all".'
                    type: string
                  graph:
                    description: |-
                      Graph is a DynamoGraphDeployment name; with Component it builds the pod
                      selector for Dynamo pods.
                    type: string
                  namespace:
                    description: Namespace of the target pods. Defaults to the Simulation's
                      namespace.
                    type: string
                  node:
                    description: Node name. GPU and node simulations act on this node.
                    type: string
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: NodeSelector selects nodes by label when Node is
                      empty.
                    type: object
                  podSelector:
                    additionalProperties:
                      type: string
                    description: |-
                      PodSelector selects target pods by label. For GPU simulations, the GPUs
                      allocated to the selected pods are targeted instead of Target.GPU.
                    type: object
                type: object
              ttlAfterFinished:
                description: |-
                  TTLAfterFinished deletes the Simulation this long after it Recovered or
                  Failed. Empty keeps it.
                type: string
              type:
                description: Type of simulation, e.g. gpu-xid, gpu-overheat, dynamo-worker-kill.
                minLength: 1
                type: string
            required:
            - type
            type: object
          status:
            description: SimulationStatus is the observed state of a Simulation.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              data:
                additionalProperties:
                  type: string
                description: Data is injector state needed for recovery (e.g. original
                  values).
                type: object
              injectedAt:
                format: date-time
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is the lifecycle phase of a Simulation.
                enum:
                - Pending
                - Waiting
                - Active
                - Recovering
                - Recovered
                - Failed
                type: string
              recoverAt:
                description: RecoverAt is when automatic recovery is due (InjectedAt
                  + Duration).
                format: date-time
                type: string
              recoveredAt:
                format: date-time
                type: string
              recoveryStartedAt:
                format: date-time
                type: string
              targets:
                description: Targets the simulation acted on.
                items:
                  description: |-
                    AffectedTarget is something a simulation acted on, recorded so recovery can
                    undo exactly what injection did.
                  properties:
                    detail:
                      type: string
                    gpu:
                      description: GPU index on Node, for GPU targets.
                      type: string
                    kind:
                      description: 'Kind of target: Node, Pod, GPU, NetworkPolicy.'
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    node:
                      type: string
                  required:
                  - kind
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
