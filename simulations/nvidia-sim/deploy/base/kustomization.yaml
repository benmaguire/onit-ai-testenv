# Simulation controller, agent mode, in namespace sim-system.
# Requires a Secret "simulator-api-token" (key: token) — see README.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sim-system
labels:
  - pairs:
      app.kubernetes.io/name: testenv-simulator
      app.kubernetes.io/part-of: testenvs
    includeSelectors: false
resources:
  - namespace.yaml
  - crds/sim.testenv.onit.ai_simulations.yaml
  - crds/sim.testenv.onit.ai_simulationclusters.yaml
  - rbac/role.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
images:
  - name: simulator
    newName: ghcr.io/benmaguire/onit-ai-testenv/simulator
    newTag: 0.1.0
