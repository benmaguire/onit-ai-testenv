# Lifecycle switches for this environment, read by argocd/applicationset.yaml.
name: observability
description: Prometheus + Grafana for all test environments and simulation baseline/fault/after metrics
# Starts disabled; enable with: scripts/envctl.sh up observability --push
enabled: "false"
# up   -> Prometheus, Grafana, exporters
# down -> Grafana scaled to 0 (Prometheus keeps collecting so baselines exist)
state: up
# simulated -> mock GPUs / simulated devices; real -> deploy onto real NVIDIA hardware
# (environments without a real-hardware mode ignore it)
hardware: simulated
targetRevision: main
namespace: observability
