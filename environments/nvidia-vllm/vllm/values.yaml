# Set by the parent chart.
state: up
hardware: simulated
envName: nvidia-vllm

# Pods carry app=<poolLabel>; the InferencePool selects on it.
poolLabel: vllm-pool

# hardware: simulated -> llm-d-inference-sim, a vLLM-compatible server with
# simulated prefill/decode timing, KV cache and the vLLM Prometheus metrics the
# Endpoint Picker scores on. No GPU, runs on amd64 and arm64.
simulator:
  image: ghcr.io/llm-d/llm-d-inference-sim:v1.1.0
  replicas: 3
  # A name not on Hugging Face uses the simulator's built-in tokenizer
  # (no download, no render sidecar).
  model: testenv/qwen3-0.6b-sim
  timeToFirstToken: 200ms
  interTokenLatency: 20ms
  maxNumSeqs: 8          # small, so queueing (and EPP queue scoring) shows under load
  # Extra simulator flags, e.g. failure injection:
  #   [--failure-injection-rate, "10", --failure-types, rate_limit]
  extraArgs: []
  # Request (mock) GPUs, e.g. 1 to place pods on nvidia-sim's Mokka GPUs.
  gpus: 0
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}

# hardware: real -> vLLM's OpenAI server on NVIDIA GPUs (GPU Operator from
# nvidia-sim with hardware: real, or any cluster exposing nvidia.com/gpu).
vllm:
  image: vllm/vllm-openai:v0.32.0
  replicas: 1            # one replica per GPU set
  model: Qwen/Qwen3-0.6B # ungated; set hfTokenSecret for gated models
  gpus: 1                # also passed as --tensor-parallel-size
  maxModelLen: 8192
  gpuMemoryUtilization: "0.90"
  extraArgs: []          # e.g. [--enable-prefix-caching, --kv-cache-dtype, fp8]
  hfTokenSecret: ""      # Secret with HF_TOKEN
  cacheSize: 50Gi        # emptyDir for the Hugging Face cache
  resources:
    requests: {cpu: "2", memory: 8Gi}
    limits: {memory: 32Gi}
