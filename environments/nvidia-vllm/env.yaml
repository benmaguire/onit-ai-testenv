# Lifecycle switches for this environment, read by argocd/applicationset.yaml.
name: nvidia-vllm
description: vLLM served through Envoy Gateway + Gateway API Inference Extension (InferencePool/EPP), or fronted by a Dynamo frontend
# Starts disabled. Choose the serving path with `frontend:` in values.yaml
# (inference-gateway | dynamo). frontend: dynamo needs nvidia-sim (Dynamo platform).
enabled: "false"
state: up
# simulated -> llm-d vLLM simulator / Dynamo mocker (no GPU); real -> vLLM on real NVIDIA GPUs
hardware: simulated
targetRevision: main
namespace: nvidia-vllm
