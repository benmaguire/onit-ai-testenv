# Lifecycle switches for this environment, read by argocd/applicationset.yaml.
name: network-kne
description: KNE network emulation (openconfig/kne) with 2 Cisco XRd routers and 2 hosts, gNMI telemetry
# Starts disabled: needs the Cisco XRd image and host prep (see README).
enabled: "false"
# up   -> meshnet, topology (routers + hosts), telemetry
# down -> topology deleted (routers/hosts gone), meshnet kept
state: up
targetRevision: main
namespace: network-kne
