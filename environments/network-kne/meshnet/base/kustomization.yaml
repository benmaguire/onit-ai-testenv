# meshnet CNI from KNE v0.3.4 (vendored manifest.yaml) with settings common to
# every cluster type. Overlays: ../k3s (k3s CNI paths), ../kind (standard paths).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manifest.yaml
patches:
  - target:
      kind: DaemonSet
      name: meshnet
    patch: |-
      # Not on KWOK virtual nodes (runai-sim).
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - {key: type, operator: NotIn, values: [kwok]}
      # The upstream 10G memory limit is for large topologies.
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 2Gi}
  - target:
      kind: Namespace
      name: meshnet
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          testenv.onit.ai/name: network-kne
