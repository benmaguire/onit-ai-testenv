# meshnet CNI (KNE v0.3.4, gRPC wire mode) adapted for k3s.
# k3s keeps CNI config and plugins in its own directories (k3s releases
# since October 2024); meshnet's install step must write there.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manifest.yaml
patches:
  - target:
      kind: DaemonSet
      name: meshnet
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/hostPath/path
        value: /var/lib/rancher/k3s/data/cni
      - op: replace
        path: /spec/template/spec/volumes/1/hostPath/path
        value: /var/lib/rancher/k3s/agent/etc/cni/net.d
      # Not on KWOK virtual nodes (runai-sim).
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - {key: type, operator: NotIn, values: [kwok]}
      # The upstream 10G memory limit is for large topologies.
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 2Gi}
  - target:
      kind: Namespace
      name: meshnet
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          testenv.onit.ai/name: network-kne
