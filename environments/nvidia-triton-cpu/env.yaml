# Lifecycle switches for this environment, read by argocd/applicationset.yaml.
name: nvidia-triton-cpu
description: NVIDIA Triton Inference Server on CPU (Python-backend models, dynamic batching, autoscaling) with load
# Starts disabled. Standalone: no GPU, Mokka or other environment needed.
enabled: "false"
# up   -> Triton + load generator
# down -> Triton and load generator at 0 replicas
state: up
# simulated -> mock GPUs / simulated devices; real -> deploy onto real NVIDIA hardware
# (environments without a real-hardware mode ignore it)
hardware: simulated
targetRevision: main
namespace: nvidia-triton-cpu
