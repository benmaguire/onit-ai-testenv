# Lifecycle switches for this environment, read by argocd/applicationset.yaml.
name: nvidia-nvsentinel
description: NVIDIA NVSentinel GPU health detection and auto-remediation (cordon/drain/recover) on nvidia-sim's GPUs, mock or real
# Starts disabled. Needs nvidia-sim (its GPU Operator runs the standalone DCGM NVSentinel polls).
enabled: "false"
state: up
# simulated -> mock GPUs / simulated devices; real -> deploy onto real NVIDIA hardware
# (environments without a real-hardware mode ignore it)
hardware: simulated
targetRevision: main
namespace: nvidia-nvsentinel
