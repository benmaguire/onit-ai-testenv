apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: testenvs
    testenv.onit.ai/name: {{ .Values.envName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-workload
  namespace: {{ .Values.namespace }}
  labels: {app: gpu-workload}
spec:
  replicas: {{ if eq .Values.state "down" }}0{{ else }}{{ .Values.replicas }}{{ end }}
  selector:
    matchLabels: {app: gpu-workload}
  template:
    metadata:
      labels: {app: gpu-workload}
    spec:
      containers:
        - name: main
          image: {{ .Values.image }}
          command: [bash, -c, "while true; do date -Is; nvidia-smi -L || true; sleep 30; done"]
          resources:
            limits:
              nvidia.com/gpu: "1"
