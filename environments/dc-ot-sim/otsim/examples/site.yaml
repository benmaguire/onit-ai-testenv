  - {id: pdu-r11, type: rack-pdu, rack: 11, params: {breakerAmps: 100}, protocols: {snmp: entity-sensor-pdu, redfish: rack-pdu}}
  - {id: pdu-r12, type: rack-pdu, rack: 12, params: {breakerAmps: 100}, protocols: {snmp: entity-sensor-pdu, redfish: rack-pdu}}
  - {id: pdu-r13, type: rack-pdu, rack: 13, params: {breakerAmps: 100}, protocols: {snmp: entity-sensor-pdu, redfish: rack-pdu}}
  - {id: pdu-r14, type: rack-pdu, rack: 14, params: {breakerAmps: 100}, protocols: {snmp: entity-sensor-pdu, redfish: rack-pdu}}
