# Lifecycle switches for this environment, read by argocd/applicationset.yaml.
name: dc-ot-sim
description: Data centre OT simulator (power, UPS/generator, PDUs, CDU/CRAH/chiller cooling, water, leaks) over Modbus TCP, SNMP and Redfish, with a DCIM-style collector
