# dc-ot-sim: a simulated data-centre OT plant for testing DCIM, BMS, EPMS and
# monitoring/alerting integrations. otsim (./otsim) runs the site model and
# serves each device over industry protocols; see README.md for the standards.

state: up
hardware: simulated
global:
  envName: dc-ot-sim
namespace: dc-ot-sim
image: ghcr.io/benmaguire/onit-ai-testenv/otsim:0.1.0
imagePullPolicy: IfNotPresent
# Country/region profile: electrical (V, Hz), climate, display units and
# reporting rules. Built in: au, us, eu, uk, de, nordics, jp-east, jp-west, sg, in, ae.
region: au
siteConfig:
  site:
    name: dc1
    region: null   # null = .Values.region
  tickSeconds: 1
  timeScale: 1
  itLoad:
    baseKW: 400
    diurnalPct: 10
    noisePct: 2
  liquidFraction: 0.7
  miscFraction: 0.03
  devices:
  - id: utility
    type: utility
    name: Utility incomer
  - id: ats-1
    type: ats
    protocols:
      modbus: generic-ats
  - id: gen-1
    type: generator
    params:
      ratedKW: 1500
      startDelaySeconds: 10
    protocols:
      modbus: generic-genset
  - id: ups-1
    type: ups
    params:
      ratedKW: 600
      batteryKWh: 100
    vendor: ExampleCo
    model: UPS-600
    protocols:
      snmp: ups-mib
      modbus: generic-ups
  - id: meter-main
    type: power-meter
    vendor: ExampleCo
    model: PM-3
    protocols:
      modbus: sunspec-203
  - id: cdu-1
    type: cdu
    params:
      capacityKW: 400
      pumps: 2
    protocols:
      modbus: generic-cdu
      redfish: cdu
  - id: crah-1
    type: crah
    protocols:
      modbus: generic-crah
  - id: crah-2
    type: crah
    protocols:
      modbus: generic-crah
  - id: chiller-1
    type: chiller
    params:
      capacityKW: 900
    protocols:
      modbus: generic-chiller
  - id: leak-cdu-1
    type: leak-sensor
    location: cdu-1
    protocols:
      modbus: generic-leak
  - id: pdu-r1
    type: rack-pdu
    rack: 1
    params:
      breakerAmps: 100
    protocols:
      snmp: entity-sensor-pdu
      redfish: rack-pdu
  - id: pdu-r2
    type: rack-pdu
    rack: 2
    params:
      breakerAmps: 100
    protocols:
      snmp: entity-sensor-pdu
      redfish: rack-pdu
  - id: pdu-r3
    type: rack-pdu
    rack: 3
    params:
      breakerAmps: 100
    protocols:
      snmp: entity-sensor-pdu
      redfish: rack-pdu
  - id: pdu-r4
    type: rack-pdu
    rack: 4
    params:
      breakerAmps: 100
    protocols:
      snmp: entity-sensor-pdu
      redfish: rack-pdu
  - id: pdu-r5
    type: rack-pdu
    rack: 5
    params:
      breakerAmps: 100
    protocols:
      snmp: entity-sensor-pdu
      redfish: rack-pdu
  - id: pdu-r6
    type: rack-pdu
    rack: 6
    params:
      breakerAmps: 100
    protocols:
      snmp: entity-sensor-pdu
      redfish: rack-pdu
  - id: pdu-r7
    type: rack-pdu
    rack: 7
    params:
      breakerAmps: 100
    protocols:
      snmp: entity-sensor-pdu
      redfish: rack-pdu
  - id: pdu-r8
    type: rack-pdu
    rack: 8
    params:
      breakerAmps: 100
    protocols:
      snmp: entity-sensor-pdu
      redfish: rack-pdu
  - id: pdu-r9
    type: rack-pdu
    rack: 9
    params:
      breakerAmps: 100
    protocols:
      snmp: entity-sensor-pdu
      redfish: rack-pdu
  - id: pdu-r10
