# Extra or overriding profiles, e.g. your vendor's Modbus map or a new region:
#   extraProfiles:
#     modbus/acme-cdu.yaml: |
#       name: acme-cdu
#       holding: [...]
#     regions/my-site.yaml: |
#       name: my-site
#       ...
extraProfiles: {}
snmpCommunity: public
# Telegraf polling every device over Modbus/SNMP/Redfish like a DCIM would
# (config generated by `otsim telegraf-config`), exported for Prometheus.
collector:
  enabled: true
  image: telegraf:1.40.3
  interval: 10s
