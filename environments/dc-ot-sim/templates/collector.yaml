{{- if .Values.collector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dcim-collector
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: dcim-collector
spec:
  replicas: {{ include "ot.replicas" . }}
  selector:
    matchLabels: {app.kubernetes.io/name: dcim-collector}
  template:
    metadata:
      labels: {app.kubernetes.io/name: dcim-collector}
      annotations:
        checksum/site: {{ include "ot.site" . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Generate the collector config from the same site + profiles otsim serves.
        - name: config
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: [telegraf-config, --config, /etc/otsim/site.yaml, --profiles-dir, /profiles,
                 --host-template, "otsim-{id}.{{ .Values.namespace }}.svc",
                 --redfish-url, "http://otsim.{{ .Values.namespace }}.svc:8443",
                 --community, {{ .Values.snmpCommunity | quote }}, --out, /work/telegraf.conf]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: site, mountPath: /etc/otsim}
            - {name: profiles, mountPath: /profiles}
            - {name: work, mountPath: /work}
      containers:
        - name: telegraf
          image: {{ .Values.collector.image }}
          args: [--config, /work/telegraf.conf]
          ports:
            - {name: metrics, containerPort: 9273}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: work, mountPath: /work}
      volumes:
        - name: site
          configMap: {name: otsim-site}
        - name: profiles
          configMap: {name: otsim-profiles}
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dcim-collector
  namespace: {{ .Values.namespace }}
  labels: {app.kubernetes.io/name: dcim-collector}
spec:
  selector: {app.kubernetes.io/name: dcim-collector}
  ports:
    - {name: metrics, port: 9273, targetPort: metrics}
{{- end }}
