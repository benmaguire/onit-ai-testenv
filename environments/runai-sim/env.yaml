# Lifecycle switches for this environment, read by argocd/applicationset.yaml.
name: runai-sim
description: Run:ai-style GPU scheduling on non-GPU hardware (KAI Scheduler + fake-gpu-operator on KWOK virtual nodes)
# Starts disabled; enable with: scripts/envctl.sh up runai-sim --push
# "true"  -> deploy KWOK, virtual GPU nodes, fake-gpu-operator, KAI Scheduler, queues and sample workloads
# "false" -> remove all of it, including the virtual nodes
enabled: "false"
# up   -> sample workloads running on the virtual GPU nodes
# down -> sample workloads scaled to 0; scheduler, nodes and queues kept
state: up
targetRevision: main
namespace: runai-sim
