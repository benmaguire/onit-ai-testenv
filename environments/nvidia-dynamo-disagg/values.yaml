state: up
# simulated | real (set by the ApplicationSet from env.yaml)
hardware: simulated
global:
  envName: nvidia-dynamo-disagg

namespace: nvidia-dynamo-disagg
name: mocker-disagg
image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.6.1
model: Qwen/Qwen3-0.6B

frontend:
  replicas: 1
  # kv: route by KV-cache overlap (prefix reuse) instead of round-robin.
  routerMode: kv
  # Retries a request on another worker if its worker dies mid-stream.
  migrationLimit: 3
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}

prefill:
  replicas: 1
  gpus: 1
  extraArgs: []
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}

decode:
  replicas: 2
  gpus: 1
  extraArgs: []
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}

speedupRatio: "1.0"

# hardware: real -> vLLM workers on real NVIDIA GPUs (needs nvidia-sim with
# hardware: real for the GPU Operator and Dynamo operator).
real:
  image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.1
  # Secret with HF_TOKEN for gated models (Qwen3-0.6B is ungated).
  hfTokenSecret: ""
  extraArgs: []
  resources:
    requests: {cpu: "2", memory: 8Gi}
    limits: {memory: 24Gi}

# Continuous traffic so dashboards and simulation baselines have data.
loadgen:
  enabled: true
  replicas: 1
  image: nicolaka/netshoot:v0.16
  concurrency: 4
  # Shared prefixes exercise the KV router; varied suffixes avoid full hits.
  maxTokens: 64
  sleepSeconds: "0.2"
