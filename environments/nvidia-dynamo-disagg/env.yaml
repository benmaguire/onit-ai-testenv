# Lifecycle switches for this environment, read by argocd/applicationset.yaml.
name: nvidia-dynamo-disagg
description: Dynamo disaggregated serving (prefill + decode, KV router, migration) on mock GPUs, with load (needs nvidia-sim platform)
# Starts disabled; needs nvidia-sim (Mokka, GPU Operator, Dynamo operator) on the same cluster.
enabled: "false"
# up   -> graph + load generator running
# down -> graph and load generator at 0 replicas
state: up
# simulated -> mock GPUs / simulated devices; real -> deploy onto real NVIDIA hardware
# (environments without a real-hardware mode ignore it)
hardware: simulated
targetRevision: main
namespace: nvidia-dynamo-disagg
