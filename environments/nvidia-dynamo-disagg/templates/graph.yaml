apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    testenv.onit.ai/name: {{ .Values.global.envName }}
  annotations:
    # DynamoGraphDeployment CRD comes from the Dynamo operator (nvidia-sim).
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  components:
    - name: Frontend
      type: frontend
      replicas: {{ include "r" (dict "root" $ "n" .Values.frontend.replicas) }}
      podTemplate:
        spec:
          containers:
            - name: main
              image: {{ if eq (.Values.hardware | default "simulated") "real" }}{{ .Values.real.image }}{{ else }}{{ .Values.image }}{{ end }}
              env:
                - name: DYN_ROUTER_MODE
                  value: {{ .Values.frontend.routerMode | quote }}
                - name: DYN_MIGRATION_LIMIT
                  value: {{ .Values.frontend.migrationLimit | quote }}
              resources: {{- toYaml .Values.frontend.resources | nindent 16 }}
    - name: prefill
      type: prefill
      replicas: {{ include "r" (dict "root" $ "n" .Values.prefill.replicas) }}
      {{- include "worker" (dict "root" $ "w" .Values.prefill "mode" "prefill") | nindent 6 }}
    - name: decode
      type: decode
      replicas: {{ include "r" (dict "root" $ "n" .Values.decode.replicas) }}
      {{- include "worker" (dict "root" $ "w" .Values.decode "mode" "decode") | nindent 6 }}
