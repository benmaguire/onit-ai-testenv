# Lifecycle switches for this environment, read by argocd/applicationset.yaml.
name: nvidia-dra-sim
description: GPUs allocated with Kubernetes DRA (ResourceClaims, NVIDIA DRA driver) on Mokka mock GPUs or real hardware
# Starts disabled. Cannot run alongside nvidia-sim (one Mokka per cluster, and
# the device plugin and DRA would hand out the same GPUs). Kubernetes >= 1.34.
enabled: "false"
state: up
# simulated -> mock GPUs / simulated devices; real -> deploy onto real NVIDIA hardware
# (environments without a real-hardware mode ignore it)
hardware: simulated
targetRevision: main
namespace: nvidia-dra-sim
