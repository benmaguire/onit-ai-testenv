state: up
hardware: real
envName: nvidia-nim
namespace: nvidia-nim

# The NIM to serve. Pick an image and tag from the NGC catalog
# (https://catalog.ngc.nvidia.com/containers?filters=nvidia_nim) that fits your GPU.
model:
  name: llama-3-1-8b-instruct
  image: nvcr.io/nim/meta/llama-3.1-8b-instruct
  tag: "1.3.3"
  gpus: 1
  # NIM profile id ('' = let the NIM choose for the GPU it finds).
  profile: ""

# Secrets you create (not stored in git), see README:
#   ngc-secret      docker-registry secret for nvcr.io
#   ngc-api-secret  generic secret with NGC_API_KEY
pullSecret: ngc-secret
authSecret: ngc-api-secret

cache:
  size: 50Gi
  storageClass: ""          # cluster default (k3s: local-path)

service:
  type: ClusterIP
  port: 8000
