# Lifecycle switches for this environment, read by argocd/applicationset.yaml.
name: nvidia-nim
description: NVIDIA NIM inference microservice (NIM Operator, NIMCache + NIMService) on real NVIDIA GPUs
# Real hardware only: needs GPUs, nvidia-sim with hardware: real (GPU Operator)
# and NGC credentials (see README). Starts disabled.
enabled: "false"
state: up
# simulated -> mock GPUs / simulated devices; real -> deploy onto real NVIDIA hardware
# (environments without a real-hardware mode ignore it)
hardware: real
targetRevision: main
namespace: nvidia-nim
