# Lifecycle switches for this environment, read by argocd/applicationset.yaml.
# Edit and push (or use scripts/envctl.sh) to change what runs on the cluster.
name: qa
description: General QA namespace (placeholder for QA workloads)
# "true"  -> Argo CD deploys the environment
# "false" -> Argo CD removes the environment and everything in it
enabled: "true"
# up   -> workloads at their configured replicas
# down -> workloads scaled to 0 (namespace and config kept)
state: up
# simulated -> mock GPUs / simulated devices; real -> deploy onto real NVIDIA hardware
# (environments without a real-hardware mode ignore it)
hardware: simulated
# Git revision Argo CD deploys this environment from.
targetRevision: main
# Default namespace for the Argo CD Application.
namespace: qa
