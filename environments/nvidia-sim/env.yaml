# Lifecycle switches for this environment, read by argocd/applicationset.yaml.
# Edit and push (or use scripts/envctl.sh) to change what runs on the cluster.
name: nvidia-sim
description: Simulated NVIDIA GPU node (Mokka) running a Dynamo mocker inference graph
# "true"  -> Argo CD deploys Mokka, GPU Operator, Dynamo platform and the graph
# "false" -> Argo CD removes all of it (see README "Removing")
enabled: "true"
# up   -> mocker graph running (frontend + decode worker)
# down -> graph scaled to 0 replicas; platform (Mokka/GPU Operator/Dynamo operator) kept
state: up
# simulated -> mock GPUs / simulated devices; real -> deploy onto real NVIDIA hardware
# (environments without a real-hardware mode ignore it)
hardware: simulated
# Git revision Argo CD deploys this environment from.
targetRevision: main
# Namespace the parent Application points at. Child Applications choose their own.
namespace: nvidia-sim
