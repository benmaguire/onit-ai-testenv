# Helm repositories used by environments. All are public; these Secrets only
# register them with Argo CD (OCI needs enableOCI). No credentials are stored.
apiVersion: v1
kind: Secret
metadata:
  name: repo-mokka-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: mokka
  type: helm
  url: ghcr.io/nvidia/k8s-test-infra/chart
  enableOCI: "true"
---
apiVersion: v1
