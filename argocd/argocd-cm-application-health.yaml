# OPTIONAL but recommended. NOT included in kustomization.yaml (it would
# replace your argocd-cm). Merge it in with:
#
#   kubectl -n argocd patch configmap argocd-cm --type merge \
#     --patch-file argocd/argocd-cm-application-health.yaml
#
# Argo CD does not assess the health of child Application resources by default,
# so sync waves in an app-of-apps (nvidia-sim) do not wait for the previous
# component to be Healthy. This restores the Application health check so
# Mokka -> GPU Operator -> Dynamo platform -> graph come up in order.
# Without it everything still converges, through retries, just less tidily.
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
